# Codex 配置文件
# 顶层配置（必须在所有 [section] 之前）
model_provider = "volcengine"
model = "doubao-seed-2-0-pro-260215"
web_search = "disabled"
project_root_markers = [".codex-root"]

# ========== 火山引擎 Provider 定义 ==========
[model_providers.volcengine]
name = "火山引擎 Doubao"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
env_key = "VOLC_API_KEY"
wire_api = "responses"
requires_openai_auth = false

# 豆包推理模型专属 ModelInfo 配置
[model_providers.volcengine.models.doubao-seed-2-0-pro-260215]
supports_reasoning_summaries = true
supports_tool_choice = false
support_verbosity = false
supports_parallel_tool_calls = false
prefer_websockets = false

# ========== Shell 环境策略 ==========
[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true
set = { VIRTUAL_ENV = "/home/codex/.venv", PATH = "/home/codex/.venv/bin:/usr/local/bin:/usr/bin:/bin" }
