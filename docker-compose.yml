version: '3.8'

services:
  # Main Codex CLI service
  codex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - RUST_VERSION=1.75
    image: codex-rs:latest
    container_name: codex-main
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CODEX_CONFIG_DIR=/home/codex/.config/codex
      - RUST_LOG=${RUST_LOG:-info}
      - DEBUG=${DEBUG:-false}
    volumes:
      # Mount current directory as workspace
      - .:/workspace
      # Mount config directory (read-only)
      - ${HOME}/.config/codex:/home/codex/.config/codex:ro
      # Mount SSH keys for git operations (read-only)
      - ${HOME}/.ssh:/home/codex/.ssh:ro
      # Mount git config (read-only)
      - ${HOME}/.gitconfig:/home/codex/.gitconfig:ro
      # Cache volume for better performance
      - codex-cache:/home/codex/.cache
      # Cargo registry cache
      - cargo-registry:/home/codex/.cargo/registry
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    command: ["codex"]
    networks:
      - codex-network
    restart: unless-stopped

  # Development service with additional tools
  codex-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder  # Use builder stage for development
    image: codex-rs:dev
    container_name: codex-dev
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CODEX_CONFIG_DIR=/home/codex/.config/codex
      - RUST_LOG=${RUST_LOG:-debug}
      - DEBUG=true
      - CARGO_TARGET_DIR=/workspace/target
    volumes:
      - .:/workspace
      - ${HOME}/.config/codex:/home/codex/.config/codex:ro
      - ${HOME}/.ssh:/home/codex/.ssh:ro
      - ${HOME}/.gitconfig:/home/codex/.gitconfig:ro
      - codex-dev-cache:/home/codex/.cache
      - cargo-dev-registry:/home/codex/.cargo/registry
      - cargo-dev-target:/workspace/target
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    command: ["bash"]
    networks:
      - codex-network
    profiles:
      - dev

  # Codex MCP Server
  codex-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-rs:latest
    container_name: codex-mcp-server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CODEX_CONFIG_DIR=/home/codex/.config/codex
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - .:/workspace
      - ${HOME}/.config/codex:/home/codex/.config/codex:ro
      - codex-mcp-cache:/home/codex/.cache
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    command: ["codex", "mcp-server"]
    networks:
      - codex-network
    ports:
      - "3000:3000"  # MCP server port
    profiles:
      - mcp

  # Codex Exec service for non-interactive execution
  codex-exec:
    build:
      context: .
      dockerfile: Dockerfile
    image: codex-rs:latest
    container_name: codex-exec
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CODEX_CONFIG_DIR=/home/codex/.config/codex
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - .:/workspace
      - ${HOME}/.config/codex:/home/codex/.config/codex:ro
      - codex-exec-cache:/home/codex/.cache
    working_dir: /workspace
    user: "${UID:-1000}:${GID:-1000}"
    networks:
      - codex-network
    profiles:
      - exec

volumes:
  # Cache volumes for better performance
  codex-cache:
    driver: local
  codex-dev-cache:
    driver: local
  codex-mcp-cache:
    driver: local
  codex-exec-cache:
    driver: local
  
  # Cargo cache volumes
  cargo-registry:
    driver: local
  cargo-dev-registry:
    driver: local
  cargo-dev-target:
    driver: local

networks:
  codex-network:
    driver: bridge
